<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My food menu</title>
    <style>
        body{
            font-family:Arial;
            background-color: rgb(119, 174, 236);
            padding: 30px;
            text-align:center;
        }
        h1{
            color: rgb(39, 205, 133);
        }
        h1+p{
            background: paleturquoise;
            padding:15px ;
            border-radius: 8px;
            color: rgb(148, 112, 239);
            display: inline-block;
        }
        ul{
            padding: 0;
            margin-top: 20px;
        }
        ul >li{
            list-style: none;
            font-size: 18px;
            color: aquamarine;
            padding: 15px;
            margin: 6px auto;
            width:260px;
            background: rgb(226, 136, 207);
            border-radius: 8px;
        }
        ul li:nth-child(3){
            background: rgb(241, 241, 157);
            color: rgb(222, 20, 145);
        }
        .desc{
            color: rgb(101, 101, 239);
            margin-top:20px ;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .desc::first-letter{
           font-size: 220%;
           color: orange;
           font-weight: bold;
        }
        .link{margin-top: 25px;}
        a{
            color: azure;
            text-decoration: none;
            font-size: 15px;
            margin: 6px;
            padding: 14px;
            border: 2px solid rgb(99, 99, 4);
            border-radius: 8px;
        }
        a:hover{
            background: rgb(0, 255, 38);
            color: white;
        }
    </style>.
</head>
<body>
    <h1>my food menu</h1>
    <p>pick your food and dig in</p>
    <ul>
        <li>pizza</li>
        <li>burger</li>
        <li>ice cream</li>
        <li>tacos-chifs specail!</li>
        <li>noodles</li>
    </ul>
    <p class="desc">Every dish on the menu is made with love and a lot of flavour. Try them all and find your favourite</p>
    <div class="links">
        <a herf="#">Order now</a>
        <a herf="#">See more</a>
    </div>
</body>
</html>
